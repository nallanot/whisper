name: whisper
services:
  ollama-init:
    image: ollama/ollama:latest
    restart: 'no'
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: '1'
    volumes:
      - ollama:/root/.ollama
    networks: [download]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        ollama serve &
        pid=$$!
        trap 'kill $$pid 2>/dev/null || true' EXIT
        count=0
        until ollama list >/dev/null 2>&1; do
          count=$$((count + 1))
          if [ "$$count" -ge 60 ]; then exit 1; fi
          sleep 1
        done
        if ! ollama show qwen3:4b >/dev/null 2>&1; then
          ollama pull qwen3:4b
        fi
  whisper-init:
    build: .
    restart: 'no'
    environment:
      HF_HUB_DISABLE_TELEMETRY: '1'
    volumes:
      - whisper:/models
    networks: [download]
    command: [python, /app/prepare_model.py]
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_NO_CLOUD: '1'
    volumes:
      - ollama:/root/.ollama
    networks: [local]
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 30
  app:
    build: .
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: qwen3:4b
      WHISPER_MODEL: small
      CPU_THREADS: '4'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    volumes:
      - whisper:/models:ro
    tmpfs:
      - /tmp:size=1073741824,mode=1777
    networks: [local]
    depends_on:
      ollama:
        condition: service_healthy
      whisper-init:
        condition: service_completed_successfully
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./traefik/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [local, proxy]
    depends_on:
      app:
        condition: service_started
    labels:
      traefik.enable: 'true'
      traefik.docker.network: '${TRAEFIK_NETWORK:-traefik-public}'
      traefik.http.routers.whisper.rule: 'Host(`${WHISPER_DOMAIN:-whisper.allanot.ovh}`)'
      traefik.http.routers.whisper.entrypoints: '${TRAEFIK_ENTRYPOINT:-websecure}'
      traefik.http.routers.whisper.tls: 'true'
      traefik.http.routers.whisper.tls.certresolver: '${TRAEFIK_CERTRESOLVER:-ovh}'
      traefik.http.routers.whisper.middlewares: '${TRAEFIK_AUTH_MIDDLEWARE:-whisper-auth@file}'
      traefik.http.routers.whisper.service: whisper
      traefik.http.services.whisper.loadbalancer.server.port: '80'
networks:
  proxy:
    external: true
    name: '${TRAEFIK_NETWORK:-traefik-public}'
  local:
    internal: true
  download: {}
volumes:
  ollama:
  whisper:
