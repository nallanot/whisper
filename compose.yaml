name: resume-local
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_NO_CLOUD: '1'
    volumes:
      - ollama:/root/.ollama
    networks: [local]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 30
  app:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:8501:8501'
    environment:
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: qwen3:4b
      WHISPER_MODEL: small
      CPU_THREADS: '4'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    volumes:
      - whisper:/models
    tmpfs:
      - /tmp:size=1073741824,mode=1777
    networks: [local]
    depends_on:
      ollama:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
networks:
  local:
    internal: true
volumes:
  ollama:
  whisper:
